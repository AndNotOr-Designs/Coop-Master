# And!Or Designs
# Coop Master controller
# 2022-09-10 v0.1 - converted to ESPHome
# 2026-04-02 v1.0 - added DHT22 and BMP22 inside coop
# 2026-07-28 v1.1 - humidity calibration tweaks
# 2026-11-16 v1.2 - adds coop door ESP32 power control

# Waterer temp in 33
# barometer SLL/SDA - AS OF 4/2/26 NOT WORKING **
# inside coop temp 15

esphome:
  name: "ct-ctrl-coop"
  on_boot:
    priority: -100
    then:
      - switch.turn_off: coopDoorPowerRelay
esp32:
  board: featheresp32
  framework:
    type: arduino

# Enable logging
logger:

#i2c port
i2c:
  sda: GPIO21
  scl: GPIO22
  scan: true

# Enable Home Assistant API
api:
  encryption:
    key: "8BrGNdB99Dsz8xA+s8bg8O1uwh1x9ylvP14zpl35aK4="

ota:
  platform: esphome
  password: "67af1704105e2cdbcd7b3d30b5448414"
  
wifi:
  ssid: !secret wifi_ssid_coop
  password: !secret wifi_password_coop

  # Static IP setup
  manual_ip:
    static_ip: 10.4.20.39  # Your static IP
    gateway: 10.4.20.1     # Gateway (usually your router IP)
    subnet: 255.255.255.0  # Subnet mask (standard for home networks)
  
  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "Ardn-Coop-Master32"
    password: "PC25ERAmA3Nf"

captive_portal:

output:
  - platform: gpio
    pin: 12
    id: indoorCoopStrip

switch:
  # Inside coop lighting
  - platform: output
    name: "Inside Coop Lights"
    icon: "mdi:led-strip-variant"
    output: indoorCoopStrip

  # Physical relay control
  # L-level trigger: GPIO LOW energizes relay
  - platform: gpio
    id: coopDoorPowerRelay
    pin:
      number: GPIO27
    restore_mode: ALWAYS_OFF
    internal: true
    name: coopDoorPower
    icon: "mdi:power-plug-battery"

  # Home Assistant power control
  # ON = relay released = NC closed = door power ON
  # OFF = relay energized = NC open = door power OFF
  - platform: template
    name: "Coop Door ESP32 Power"
    id: coopDoorPowerSwitch
    icon: "mdi:power"
    restore_mode: DISABLED
    lambda: |-
      return !id(coopDoorPowerRelay).state;
    turn_on_action:
      - switch.turn_off: coopDoorPowerRelay
    turn_off_action:
      - switch.turn_on: coopDoorPowerRelay
    
script:
  - id: coopDoorPowerCycle
    mode: single              # ignores extra presses while a cycle is running
    then:
      - switch.turn_on: coopDoorPowerRelay     # energize relay = NC opens = door power OFF
      - delay: 10s
      - switch.turn_off: coopDoorPowerRelay    # release relay = door power back ON
    
button:
  - platform: template
    name: "Coop Door ESP32 Reboot"
    icon: "mdi:restart"
    on_press:
      - script.execute: coopDoorPowerCycle
        
binary_sensor:
  - platform: gpio
    pin:
      number: 32
      inverted: true
      mode:
        input: true
        pullup: true
    name: "Waterer Level"
    id: watererLevel
    icon: "mdi:water"
    filters:
      - delayed_on: 10ms
      - delayed_off: 10ms

one_wire:
  - platform: gpio
    pin: 33

sensor:
  - platform: adc
    pin: A2
    attenuation: 12db
    raw: false
    name: "Sun Level"
    update_interval: 60s
    icon: "mdi:brightness-percent"
    unit_of_measurement: "%"
    filters:
      - sliding_window_moving_average:
          window_size: 10
          send_every: 1
      - calibrate_linear:
          - 0.16 -> 0
          - 2.92 -> 100
      - lambda: |-
          if (x < 0) return 0;
          if (x > 100) return 100;
          return x;

  - platform: dallas_temp
    address: 0xa602099177e8bb28
    name: "Waterer Temperature"
    update_interval: 60s
    unit_of_measurement: "°C"
    icon: "mdi:coolant-temperature"

  - platform: dht
    pin: GPIO15
    model: DHT22
    temperature:
      name: "Temperature"
    humidity:
      name: "Humidity"
      filters:
        - calibrate_linear:
            - 33.3 -> 45.0
            - 79.7 -> 71.2
        - lambda: |-
            if (x < 0) return 0;
            if (x > 100) return 100;
            return x;
    update_interval: 60s